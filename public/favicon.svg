<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Deep Kauman Night) -->
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#2C2038" />
      <stop offset="55%" stop-color="#181124" />
      <stop offset="100%" stop-color="#0D0814" />
    </radialGradient>

    <!-- Outer Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3DC9B" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#C9A24A" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#70481E" stop-opacity="0.6" />
    </linearGradient>

    <!-- Antique Brass Metal Gradient (Kuningan Kauman) -->
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0C7" />
      <stop offset="25%" stop-color="#E5C16C" />
      <stop offset="65%" stop-color="#B88A34" />
      <stop offset="100%" stop-color="#6E4416" />
    </linearGradient>

    <!-- Brass Highlight -->
    <linearGradient id="brassLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF4D4" />
      <stop offset="50%" stop-color="#D8AA47" />
      <stop offset="100%" stop-color="#8F591E" />
    </linearGradient>

    <!-- Wood Trim Gradient (Kayu Jati Langgar) -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9C6635" />
      <stop offset="50%" stop-color="#6E431E" />
      <stop offset="100%" stop-color="#4A2A0F" />
    </linearGradient>

    <!-- Lantern Core Glow (Cahaya Lentera) -->
    <radialGradient id="lanternGlow" cx="50%" cy="54%" r="48%">
      <stop offset="0%" stop-color="#FFFDF2" stop-opacity="1" />
      <stop offset="22%" stop-color="#FFE094" stop-opacity="0.95" />
      <stop offset="52%" stop-color="#FF9640" stop-opacity="0.75" />
      <stop offset="78%" stop-color="#D85C16" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#B83A00" stop-opacity="0" />
    </radialGradient>

    <!-- Ambient Outer Lantern Flare -->
    <radialGradient id="outerFlare" cx="50%" cy="54%" r="55%">
      <stop offset="0%" stop-color="#FFB347" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#FF7A18" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#181124" stop-opacity="0" />
    </radialGradient>

    <!-- VR Visor Body Gradient -->
    <linearGradient id="vrBodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#241B33" />
      <stop offset="45%" stop-color="#140D20" />
      <stop offset="100%" stop-color="#0A0612" />
    </linearGradient>

    <!-- VR Visor Rim (Kuningan + Cyan WebXR Accent) -->
    <linearGradient id="vrRimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE29A" />
      <stop offset="40%" stop-color="#42A5F5" />
      <stop offset="70%" stop-color="#29B6F6" />
      <stop offset="100%" stop-color="#C9A24A" />
    </linearGradient>

    <!-- VR Left Lens Glow -->
    <radialGradient id="lensGlowL" cx="45%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#E1F5FE" />
      <stop offset="35%" stop-color="#4FC3F7" />
      <stop offset="70%" stop-color="#0288D1" />
      <stop offset="100%" stop-color="#013668" />
    </radialGradient>

    <!-- VR Right Lens Glow -->
    <radialGradient id="lensGlowR" cx="55%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FFF9C4" />
      <stop offset="35%" stop-color="#FFD54F" />
      <stop offset="70%" stop-color="#FF8F00" />
      <stop offset="100%" stop-color="#B24700" />
    </radialGradient>

    <!-- Filter for Soft Bloom -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base App Icon Tile (Modern Rounded Squircle) -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="7" />

  <!-- Ambient Flare behind Lantern -->
  <circle cx="256" cy="275" r="190" fill="url(#outerFlare)" />

  <!-- ================= LENTERA KAUMAN ================= -->

  <!-- Top Hanging Brass Loop (Cincin Gantungan) -->
  <g id="top-loop">
    <circle cx="256" cy="62" r="28" fill="none" stroke="url(#brassGrad)" stroke-width="11" />
    <ellipse cx="256" cy="86" rx="14" ry="7" fill="url(#brassLight)" />
  </g>

  <!-- Lantern Crown / Cap (Kubah Kuningan & Kayu) -->
  <g id="lantern-crown">
    <!-- Top finial bulb -->
    <path d="M246 88 C246 80, 266 80, 266 88 L262 98 L250 98 Z" fill="url(#brassLight)" />
    <!-- Tier 1 cap -->
    <path d="M224 100 L288 100 L296 114 L216 114 Z" fill="url(#woodGrad)" stroke="#4A2A0F" stroke-width="2" />
    <!-- Tier 2 dome (Arching Pagoda / Langgar eaves) -->
    <path d="M216 114 C236 122, 276 122, 296 114 L336 138 C310 144, 202 144, 176 138 Z" fill="url(#brassGrad)" />
    <!-- Lower rim of cap -->
    <rect x="170" y="138" width="172" height="12" rx="4" fill="url(#brassLight)" />
  </g>

  <!-- Lantern Glass Chamber (Chamber Kaca Berisi Api & Cahaya) -->
  <g id="lantern-body">
    <!-- Glass Background Shape -->
    <path d="M182 150 L330 150 L356 355 L156 355 Z" fill="#181022" />
    <!-- Radiant Inner Glow -->
    <path d="M182 150 L330 150 L356 355 L156 355 Z" fill="url(#lanternGlow)" filter="url(#glowFilter)" />

    <!-- Side Brass Pillars (Tiang Penyangga Lentera) -->
    <!-- Left Strut -->
    <path d="M178 148 L188 150 L166 355 L154 355 Z" fill="url(#brassGrad)" />
    <!-- Right Strut -->
    <path d="M334 150 L344 148 L358 355 L346 355 Z" fill="url(#brassGrad)" />

    <!-- Subtle Glass Refraction Highlights -->
    <path d="M192 160 L212 160 L188 345 L174 345 Z" fill="#FFFFFF" opacity="0.12" />
  </g>

  <!-- ================= WEBXR / VR HEADSET INSIDE LANTERN ================= -->
  <g id="vr-headset" transform="translate(0, 5)">
    <!-- Visor Halo / Backplate Glow -->
    <rect x="170" y="222" width="172" height="96" rx="36" fill="#000000" opacity="0.55" filter="url(#glowFilter)" />

    <!-- Headset Straps (Left & Right Anchors) -->
    <path d="M152 262 L178 258 L178 282 L152 278 Z" fill="url(#woodGrad)" stroke="url(#brassGrad)" stroke-width="2" />
    <path d="M360 262 L334 258 L334 282 L360 278 Z" fill="url(#woodGrad)" stroke="url(#brassGrad)" stroke-width="2" />

    <!-- Main VR Visor Body -->
    <path d="M182 232 
             C210 224, 302 224, 330 232 
             C346 237, 350 252, 350 272 
             C350 292, 344 310, 328 314 
             C302 319, 282 319, 272 305 
             C266 297, 246 297, 240 305 
             C230 319, 210 319, 184 314 
             C168 310, 162 292, 162 272 
             C162 252, 166 237, 182 232 Z" 
          fill="url(#vrBodyGrad)" 
          stroke="url(#vrRimGrad)" 
          stroke-width="7" />

    <!-- Top Brow Ridge Accent -->
    <path d="M198 238 C232 232, 280 232, 314 238" fill="none" stroke="#E5C16C" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />

    <!-- ================= DUAL VR LENSES (WEBXR DUAL EYE) ================= -->
    <!-- Left Lens: Cyan WebXR Insight Glow -->
    <g id="left-lens">
      <!-- Lens Frame -->
      <circle cx="218" cy="272" r="32" fill="#0E1726" stroke="url(#brassGrad)" stroke-width="3.5" />
      <!-- Glass Core -->
      <circle cx="218" cy="272" r="27" fill="url(#lensGlowL)" />
      <!-- Fresnel Ring -->
      <circle cx="218" cy="272" r="20" fill="none" stroke="#81D4FA" stroke-width="2" opacity="0.6" />
      <circle cx="218" cy="272" r="11" fill="none" stroke="#B3E5FC" stroke-width="1.5" opacity="0.8" />
      <!-- Lens Reflection Specular -->
      <ellipse cx="212" cy="264" rx="6" ry="3.5" transform="rotate(-30, 212, 264)" fill="#FFFFFF" opacity="0.85" />
    </g>

    <!-- Right Lens: Warm Kauman Golden Glow -->
    <g id="right-lens">
      <!-- Lens Frame -->
      <circle cx="294" cy="272" r="32" fill="#241408" stroke="url(#brassGrad)" stroke-width="3.5" />
      <!-- Glass Core -->
      <circle cx="294" cy="272" r="27" fill="url(#lensGlowR)" />
      <!-- Fresnel Ring -->
      <circle cx="294" cy="272" r="20" fill="none" stroke="#FFE082" stroke-width="2" opacity="0.6" />
      <circle cx="294" cy="272" r="11" fill="none" stroke="#FFF59D" stroke-width="1.5" opacity="0.8" />
      <!-- Lens Reflection Specular -->
      <ellipse cx="288" cy="264" rx="6" ry="3.5" transform="rotate(-30, 288, 264)" fill="#FFFFFF" opacity="0.85" />
    </g>

    <!-- Center Nose Bridge Brass Rivet -->
    <circle cx="256" cy="254" r="4.5" fill="#FFE082" stroke="#6E4416" stroke-width="1.5" />
  </g>

  <!-- ================= LANTERN BASE (KAKI LENTERA) ================= -->
  <g id="lantern-base">
    <!-- Upper Base Ring -->
    <rect x="154" y="354" width="204" height="14" rx="5" fill="url(#brassLight)" />
    <!-- Mid Base Inset (Kayu Jati) -->
    <path d="M166 368 L346 368 L334 388 L178 388 Z" fill="url(#woodGrad)" stroke="#3D2109" stroke-width="2" />
    <!-- Lower Base Ring -->
    <rect x="174" y="388" width="164" height="14" rx="4" fill="url(#brassGrad)" />
    <!-- Bottom Droplet / Finial -->
    <path d="M248 402 C248 418, 264 418, 264 402 Z" fill="url(#brassLight)" />
  </g>

  <!-- Four Guiding Sparkles (Nilai-Nilai Pencerahan) -->
  <g id="sparkles" fill="#FFF8E7" opacity="0.9">
    <!-- Top-Right Sparkle -->
    <path d="M380 170 Q380 185 395 185 Q380 185 380 200 Q380 185 365 185 Q380 185 380 170" fill="#FFE29A" />
    <!-- Left Mid Sparkle -->
    <path d="M125 240 Q125 250 135 250 Q125 250 125 260 Q125 250 115 250 Q125 250 125 240" fill="#42A5F5" />
  </g>
</svg>
